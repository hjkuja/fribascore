name: Blazor UI CI

on:
  push:
    branches: [ main ]
    paths:
      - 'bui/**'
      - '.github/workflows/bui-ci.yml'
  pull_request:
    paths:
      - 'bui/**'
      - '.github/workflows/bui-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 #v5.2.0
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: 'bui/packages.lock.json'

      - name: Restore
        run: dotnet restore bui/FribaScore.Bui.slnx --locked-mode

      - name: Build
        run: dotnet build bui/FribaScore.Bui.slnx --no-restore -c Release
